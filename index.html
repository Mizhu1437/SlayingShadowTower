<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>東方戮影塔 〜 Formless Barrage</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #05060c;
      color: #e6edf3;
      font: 13px/1.6 "Consolas", "Menlo", monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 6px;
      min-height: 100vh;
      padding: 8px 0 10px;
      overflow: hidden;
      user-select: none;
    }
    #stage { position: relative; flex-shrink: 0; }
    #stage canvas { display: block; }

    .panel {
      position: fixed;
      background: rgba(8, 10, 20, 0.86);
      border: 1px solid #2a3350;
      border-radius: 6px;
      backdrop-filter: blur(6px);
      pointer-events: none;
    }

    /* ── 右上角：图标化状态栏 ── */
    #hud-top {
      position: absolute;
      top: 8px;
      right: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
      pointer-events: none;
      z-index: 30;
    }
    .hud-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .hud-icon {
      width: 22px;
      height: 22px;
      image-rendering: pixelated;
      filter: drop-shadow(0 0 3px rgba(159, 227, 255, 0.4));
    }
    .hud-num {
      font-family: "Consolas", "Menlo", monospace;
      font-size: 16px;
      font-weight: 700;
      color: #9fe3ff;
      text-shadow: 0 0 6px rgba(159, 227, 255, 0.5);
      min-width: 18px;
      text-align: right;
    }
    .hud-spell-slots {
      display: flex;
      gap: 3px;
    }
    .hud-spell-slot {
      width: 26px;
      height: 26px;
      image-rendering: pixelated;
      opacity: 0.95;
    }
    .hud-spell-slot.empty { opacity: 0.32; }

    /* ── 战场内左上：幕 / 波次 / 倒计时 ── */
    #hud-stage {
      position: absolute;
      top: 8px;
      left: 10px;
      pointer-events: none;
      z-index: 30;
      font-family: "Consolas", "Menlo", monospace;
      font-size: 12px;
      color: #9fb4d0;
      letter-spacing: 1px;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
    }
    .stage-line { display: flex; align-items: center; gap: 6px; }
    .stage-act { color: #c79bff; font-weight: 700; font-size: 14px; }
    .stage-sep { color: #3a4a6a; }
    .stage-timer { color: #9fe3ff; }
    .stage-timer.urgent { color: #ff5c6e; font-weight: 700; }

    #help {
      bottom: 14px;
      left: 14px;
      padding: 9px 13px;
      color: #7d8aa8;
      font-size: 11px;
      line-height: 1.9;
    }
    kbd {
      background: #1a2135;
      border: 1px solid #2f3b5c;
      border-radius: 3px;
      padding: 1px 5px;
      color: #9fe3ff;
      font-size: 11px;
    }

    #title {
      position: fixed;
      top: 14px;
      right: 16px;
      color: #2f3b5c;
      font-size: 11px;
      letter-spacing: 1px;
      pointer-events: none;
    }

    /* ---------- 续关 / 结算 覆盖层 ---------- */
    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(3, 4, 9, 0.82);
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(3px);
      z-index: 10;
    }
    #overlay.hidden { display: none; }

    #overlay-box {
      background: rgba(10, 13, 24, 0.96);
      border: 1px solid #3a4a70;
      border-radius: 10px;
      padding: 26px 36px;
      min-width: 290px;
      text-align: center;
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.6);
    }
    #overlay-title {
      font-size: 19px;
      color: #ff8fa3;
      letter-spacing: 2px;
      margin-bottom: 14px;
    }
    #overlay-stats {
      color: #9fb0d0;
      font-size: 12px;
      line-height: 1.9;
      margin-bottom: 20px;
    }
    #overlay-stats b { color: #9fe3ff; }
    .btn-row { display: flex; gap: 12px; justify-content: center; }
    .btn {
      background: #1a2135;
      border: 1px solid #3a4a70;
      color: #cfe4ff;
      border-radius: 5px;
      padding: 8px 22px;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s;
    }
    .btn:hover {
      background: #24304e;
      border-color: #5a76b0;
    }
    .btn.primary {
      background: #2a3f66;
      border-color: #4a6ba8;
    }
    .btn.primary:hover { background: #35507f; }
    .btn-hint {
      margin-top: 14px;
      color: #55648a;
      font-size: 10.5px;
    }

    /* ---------- 手牌区 ---------- */
    #hand-area {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    .energy-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      max-width: 300px;
    }
    .energy-pips { display: flex; gap: 5px; }
    .pip {
      width: 13px; height: 13px;
      border-radius: 50%;
      background: #1a2135;
      border: 1px solid #3a4a70;
      transition: background 0.12s, box-shadow 0.12s;
    }
    .pip.on {
      background: #6fd3ff;
      box-shadow: 0 0 8px rgba(111, 211, 255, 0.7);
      border-color: #9fe3ff;
    }
    .energy-bar {
      flex: 1;
      height: 3px;
      background: #1a2135;
      border-radius: 2px;
      position: relative;
      overflow: hidden;
    }
    .energy-bar::after {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 0;
    }
    .energy-bar { --w: 0; }
    .energy-bar {
      background-image: linear-gradient(#6fd3ff, #6fd3ff);
      background-repeat: no-repeat;
      background-size: var(--w) 100%;
      transition: background-size 0.1s linear;
    }
    .energy-bar.full { background: #35507f; }

    .hand-root {
      display: flex;
      gap: 7px;
      justify-content: center;
      align-items: flex-end;
      min-height: 78px;
    }

    .card {
      width: 82px;
      height: 76px;
      background: linear-gradient(160deg, #141a2b, #0e1320);
      border: 1px solid #2f3b5c;
      border-radius: 6px;
      padding: 5px 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      position: relative;
      transition: transform 0.12s, border-color 0.12s, box-shadow 0.12s;
      flex-shrink: 0;
    }
    .card.selected {
      border-color: #6fd3ff;
      transform: translateY(-9px);
      box-shadow: 0 0 14px rgba(111, 211, 255, 0.45);
    }
    .card.passive { border-color: #4a3a6b; }

    .card-cost {
      position: absolute;
      top: -6px; left: -6px;
      width: 19px; height: 19px;
      border-radius: 50%;
      background: #2a3f66;
      border: 1px solid #6fd3ff;
      color: #9fe3ff;
      font-size: 11px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card-name {
      font-size: 10.5px;
      color: #cfe4ff;
      font-weight: bold;
      text-align: center;
      margin-top: 2px;
      letter-spacing: 0.5px;
    }
    .card-text {
      font-size: 9px;
      color: #7d8aa8;
      line-height: 1.35;
      flex: 1;
      overflow: hidden;
    }

    .hand-info {
      font-size: 10px;
      color: #55648a;
      height: 14px;
      letter-spacing: 0.3px;
    }
    .hand-info.overload { color: #ff8fa3; }
    /* ── 商店界面 ── */
    .shop-overlay {
      position: fixed;
      inset: 0;
      background: rgba(4, 5, 12, 0.9);
      backdrop-filter: blur(3px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }
    .shop-overlay.hidden { display: none; }

    .shop-panel {
      width: 780px;
      max-height: 88vh;
      overflow-y: auto;
      background: #0b0d18;
      border: 1px solid #2a3350;
      border-radius: 6px;
      padding: 18px 20px;
      box-shadow: 0 12px 60px rgba(0, 0, 0, 0.7);
    }

    .shop-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid #222a44;
      padding-bottom: 10px;
      margin-bottom: 10px;
    }
    .shop-title {
      font-size: 16px;
      color: #c79bff;
      letter-spacing: 2px;
    }
    .shop-coins { font-size: 12px; color: #8f9ab8; }
    .shop-coins b { color: #ffd479; font-size: 15px; }

    .shop-hint {
      min-height: 18px;
      font-size: 12px;
      color: #8f9ab8;
      margin-bottom: 8px;
    }
    .shop-hint.warn { color: #ffb454; }

    .shop-list {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .shop-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 10px;
      min-height: 112px;
      background: #12172a;
      border: 1px solid #26304d;
      border-radius: 4px;
      color: #dfe6f5;
      font: inherit;
      text-align: left;
      cursor: pointer;
      transition: border-color .12s, background .12s;
    }
    .shop-item:hover:not(:disabled) {
      border-color: #6b8cff;
      background: #1a2140;
    }
    .shop-item.sold {
      opacity: .32;
      cursor: default;
    }
    .shop-item.expensive { border-color: #4a2530; }
    .shop-item.expensive .si-price { color: #ff7b8a; }

    .si-kind { font-size: 9px; color: #6f7d9c; letter-spacing: 1px; }
    .si-name { font-size: 13px; color: #e8eeff; font-weight: 600; }
    .si-energy { font-size: 10px; color: #7fd8ff; letter-spacing: .5px; }
    .si-desc { font-size: 10px; color: #93a0bd; line-height: 1.45; flex: 1; }
    .si-price { font-size: 11px; color: #ffd479; }

    .shop-remove {
      margin-top: 14px;
      border-top: 1px solid #222a44;
      padding-top: 12px;
    }
    .shop-remove.hidden { display: none; }
    .shop-remove-title { font-size: 12px; color: #ffb454; margin-bottom: 8px; }
    .shop-remove-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-height: 220px;
      overflow-y: auto;
    }
    .shop-remove-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 6px 10px;
      background: #1a1220;
      border: 1px solid #4a2a3a;
      border-radius: 3px;
      color: #e8d8e0;
      font: inherit;
      font-size: 11px;
      cursor: pointer;
    }
    .shop-remove-item:hover { border-color: #ff6b8a; background: #2a1520; }
    .sri-cost { font-size: 9px; color: #9a7a8a; }

    .shop-foot {
      margin-top: 14px;
      display: flex;
      justify-content: flex-end;
    }
    .shop-btn {
      padding: 8px 20px;
      background: #1c2440;
      border: 1px solid #3a4a75;
      border-radius: 4px;
      color: #cfe0ff;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }
    .shop-btn:hover { border-color: #6b8cff; background: #24305a; }

    /* ── 开发者控制台 ── */
    .dev-console {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: min(760px, 96vw);
      max-height: 45vh;
      display: flex;
      flex-direction: column;
      background: rgba(8, 10, 18, 0.97);
      border: 1px solid #2ea44f;
      border-bottom: none;
      border-radius: 6px 6px 0 0;
      z-index: 200;
      font: 12px/1.5 "Consolas", "Menlo", monospace;
      box-shadow: 0 -6px 40px rgba(0, 0, 0, 0.8);
    }
    .dev-console.hidden { display: none; }

    .dc-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 10px;
      background: #0f1a12;
      border-bottom: 1px solid #1e3a26;
      color: #4ade80;
      font-size: 11px;
      letter-spacing: 1px;
    }
    .dc-hint { color: #4b6b56; font-size: 10px; }

    .dc-output {
      flex: 1;
      overflow-y: auto;
      padding: 8px 10px;
      min-height: 120px;
      max-height: 30vh;
      color: #b8c4d0;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .dc-line { margin: 1px 0; }
    .dc-error { color: #ff7b8a; }
    .dc-output .dc-line:first-child { color: #6b7d8f; }

    .dc-input-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px 8px;
      border-top: 1px solid #1e3a26;
    }
    .dc-prompt { color: #4ade80; }
    .dc-input-row input {
      flex: 1;
      background: #05070c;
      border: 1px solid #24382c;
      border-radius: 3px;
      padding: 5px 8px;
      color: #d8e6de;
      font: inherit;
      outline: none;
    }
    .dc-input-row input:focus { border-color: #2ea44f; }

    /* ── 牌堆查看 ── */
    #pile-bar {
      position: fixed;
      right: 14px;
      bottom: 14px;
      display: flex;
      gap: 6px;
      z-index: 40;
    }
    .pv-btn {
      padding: 6px 12px;
      background: #101526;
      border: 1px solid #26304d;
      border-radius: 4px;
      color: #9aa7c2;
      font: inherit;
      font-size: 11px;
      cursor: pointer;
      transition: border-color .12s, background .12s;
    }
    .pv-btn:hover { border-color: #6b8cff; background: #1a2140; }
    .pv-btn.active { border-color: #6b8cff; background: #1e2a52; color: #d0e0ff; }
    .pv-btn b { color: #ffd479; margin-left: 3px; }

    .pile-viewer {
      position: fixed;
      right: 14px;
      bottom: 54px;
      width: 300px;
      max-height: 52vh;
      display: flex;
      flex-direction: column;
      background: rgba(10, 13, 24, 0.97);
      border: 1px solid #2a3350;
      border-radius: 6px;
      z-index: 41;
      font: 11px/1.5 "Consolas", "Menlo", monospace;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.75);
    }
    .pile-viewer.hidden { display: none; }

    .pv-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 10px;
      border-bottom: 1px solid #222a44;
      color: #c79bff;
      font-size: 11px;
    }
    .pv-close {
      background: none;
      border: none;
      color: #6f7d9c;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      padding: 0 2px;
    }
    .pv-close:hover { color: #ff7b8a; }

    .pv-list {
      overflow-y: auto;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .pv-empty { color: #556071; padding: 12px; text-align: center; }

    .pv-card {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 6px;
      padding: 6px 8px;
      background: #12172a;
      border-left: 2px solid #3a4a75;
      border-radius: 3px;
    }
    .pv-card.passive { border-left-color: #c79bff; }
    .pv-name { color: #dfe6f5; font-weight: 600; }
    .pv-cost { color: #ffd479; font-size: 10px; }
    .pv-desc { flex-basis: 100%; color: #7d8aa5; font-size: 10px; }

    #wave-timer.urgent { color: #ff5c6e; font-weight: 700; }

    /* ── 横版两侧面板 ── */
    /* 战场固定 384 宽，两侧各 150。面板贴边排布，不覆盖战场。 */
    /* 面板贴着战场两侧，垂直方向上居中于战场 */
    .side-panel {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      width: 168px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      pointer-events: none;
      z-index: 30;
      font-family: "Consolas", "Menlo", monospace;
    }
    /*
     * 战场总宽 1094（684 逻辑 ×1.6），半宽 547。
     * 面板要贴在战场**外侧**，再留 12px 间隙。
     * 之前用 307（=192×1.6）算错了：那是战场「内容」半宽，
     * 不是整个画布半宽，结果面板压进了战场里。
     */
    #panel-left {
      left: calc(50% - 462px - 168px - 10px);
      align-items: flex-start;
    }
    #panel-right {
      right: calc(50% - 462px - 168px - 10px);
      align-items: flex-end;
    }

    .panel-block { display: flex; flex-direction: column; gap: 4px; }
    #panel-right .panel-block { align-items: flex-end; }

    .panel-label {
      font-size: 10px;
      color: #6f7d9c;
      letter-spacing: 2px;
    }
    .panel-value {
      font-size: 18px;
      font-weight: 700;
      color: #9fe3ff;
      text-shadow: 0 0 8px rgba(159, 227, 255, 0.45);
    }
    .panel-act {
      font-size: 26px;
      font-weight: 700;
      color: #c79bff;
      text-shadow: 0 0 10px rgba(199, 155, 255, 0.5);
      line-height: 1;
    }
    .panel-wave {
      font-size: 15px;
      color: #b8d4ee;
      letter-spacing: 1px;
    }
    .panel-timer {
      font-size: 19px;
      font-weight: 700;
      color: #9fe3ff;
      text-shadow: 0 0 8px rgba(159, 227, 255, 0.4);
    }
    .panel-timer.urgent {
      color: #ff5c6e;
      text-shadow: 0 0 10px rgba(255, 92, 110, 0.6);
      animation: pulse-warn 0.8s ease-in-out infinite;
    }
    @keyframes pulse-warn {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.55; }
    }

    /* 残机：东方正作式的小星形，每台一个 */
    .lives-row { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }
    .life-star {
      width: 15px;
      height: 15px;
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%,
                         79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      background: linear-gradient(160deg, #ffe6a0, #ff9f5c);
      filter: drop-shadow(0 0 4px rgba(255, 200, 120, 0.7));
    }
    .life-star.lost { background: #2a3350; filter: none; opacity: 0.45; }

    /* 符卡：竖长符札形 */
    .spell-row { display: flex; gap: 5px; justify-content: flex-end; }
    .spell-tag {
      width: 13px;
      height: 26px;
      border-radius: 2px;
      background: linear-gradient(180deg, #e0c8ff, #9b6fd6);
      box-shadow: 0 0 6px rgba(180, 140, 255, 0.65);
      position: relative;
    }
    .spell-tag::after {
      content: '';
      position: absolute;
      left: 50%; top: 5px; bottom: 5px;
      width: 1px;
      background: rgba(255, 255, 255, 0.5);
      transform: translateX(-50%);
    }
    .spell-tag.empty {
      background: #232a44;
      box-shadow: none;
      opacity: 0.5;
    }
    .spell-tag.empty::after { background: rgba(255,255,255,0.12); }

    .coin-row { display: flex; align-items: center; gap: 6px; }
    .coin-icon { width: 20px; height: 20px; image-rendering: pixelated; }

    /* ── 卡组总览（Tab） ── */
    .deck-overlay {
      position: fixed;
      inset: 0;
      background: rgba(4, 6, 12, 0.88);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 120;
    }
    .deck-overlay.hidden { display: none; }

    .deck-panel {
      width: min(900px, 92vw);
      max-height: 86vh;
      display: flex;
      flex-direction: column;
      background: #0a0d18;
      border: 1px solid #2a3350;
      border-radius: 8px;
      box-shadow: 0 20px 80px rgba(0, 0, 0, 0.85);
      overflow: hidden;
    }
    .deck-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 14px 20px;
      border-bottom: 1px solid #1e2740;
    }
    .deck-title { font-size: 17px; color: #c79bff; letter-spacing: 3px; }
    .deck-close-hint { font-size: 11px; color: #55607a; }

    .deck-stats {
      display: flex;
      gap: 26px;
      padding: 10px 20px;
      font-size: 12px;
      color: #8794b0;
      border-bottom: 1px solid #161d31;
    }
    .deck-stats b { color: #9fe3ff; font-size: 14px; margin: 0 2px; }

    .deck-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
      gap: 8px;
      padding: 16px 20px;
      overflow-y: auto;
    }
    .deck-card {
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 9px 10px;
      min-height: 96px;
      background: #12172a;
      border: 1px solid #26304d;
      border-left: 3px solid #6b8cff;
      border-radius: 4px;
    }
    .deck-card.passive { border-left-color: #c79bff; background: #171228; }
    .dc-top { display: flex; justify-content: space-between; align-items: baseline; gap: 4px; }
    .dc-name { font-size: 13px; color: #e8eeff; font-weight: 600; }
    .dc-count { font-size: 11px; color: #ffd479; }
    .dc-cost { font-size: 10px; color: #7fd8ff; }
    .dc-text { font-size: 10px; color: #8a97b4; line-height: 1.5; flex: 1; }
    .deck-empty { color: #55607a; padding: 30px; text-align: center; grid-column: 1/-1; }

    .deck-foot {
      padding: 8px 20px;
      border-top: 1px solid #1e2740;
      font-size: 11px;
      color: #6f7d9c;
      text-align: center;
    }

    /* 手牌数 / 上限 */
    .hand-count {
      font-family: "Consolas", "Menlo", monospace;
      font-size: 12px;
      color: #8794b0;
      letter-spacing: 1px;
      margin-bottom: 2px;
    }
    .hand-count::first-letter { color: #6f7d9c; }

  </style>
</head>
<body>
  <div id="stage"></div>

  <div id="title">東方戮影塔 〜 Formless Barrage</div>

  <!-- 手牌与能量（DOM 实现，位于场地下方） -->
  <div id="hand-area"></div>

  <!-- 左侧面板：幕次 / 波次 / 倒计时 / 得分 -->
  <aside id="panel-left" class="side-panel">
    <div class="panel-block">
      <div class="panel-label">幕次</div>
      <div class="panel-act" id="act">—</div>
    </div>
    <div class="panel-block">
      <div class="panel-label">波次</div>
      <div class="panel-wave"><span id="wave">—</span></div>
      <div class="panel-timer" id="wave-timer">—</div>
    </div>
    <div class="panel-block">
      <div class="panel-label">得分</div>
      <div class="panel-value" id="score">0</div>
    </div>
  </aside>

  <!-- 右侧面板：残机 / 符卡 / 蜃銭 / 击破 -->
  <aside id="panel-right" class="side-panel">
    <div class="panel-block">
      <div class="panel-label">残机</div>
      <div class="lives-row" id="lives-row"></div>
    </div>
    <div class="panel-block">
      <div class="panel-label">符卡</div>
      <div class="spell-row" id="spell-row"></div>
    </div>
    <div class="panel-block">
      <div class="panel-label">蜃銭</div>
      <div class="coin-row">
        <img class="coin-icon" src="./art/ui/coin_icon.png" alt="" />
        <span class="panel-value" id="coins">0</span>
      </div>
    </div>
    <div class="panel-block">
      <div class="panel-label">击破</div>
      <div class="panel-value" id="kills">0</div>
    </div>
  </aside>

  <!-- 隐藏的数据源（供 main.ts 读取，不显示） -->
  <div id="hud-data" style="display:none">
    <span id="kills">0</span>
    <span id="score">0</span>
    <span id="fps">—</span>
  </div>

  <div id="help" class="panel">
    <div><kbd>方向键</kbd>/<kbd>WASD</kbd> 移动　<kbd>Shift</kbd> 低速</div>
    <div><kbd>X</kbd> 释放符卡（中弹后有短暂决死窗口）</div>
    <div><kbd>C</kbd> 切换选中的卡　<kbd>Z</kbd> 打出　<kbd>X</kbd> 释放符卡</div>
    <div style="color:#ff8fa3;margin-top:4px">※ 本作没有自动射击 —— 所有输出只能靠卡牌</div>
  </div>

  <div id="overlay" class="hidden">
    <div id="overlay-box">
      <div id="overlay-title">残机耗尽</div>
      <div id="overlay-stats"></div>
      <div class="btn-row">
        <button class="btn primary" id="btn-continue" data-action="continue">续关</button>
        <button class="btn" id="btn-giveup" data-action="giveup">放弃</button>
      </div>
      <div class="btn-hint"><kbd>Enter</kbd> 续关　<kbd>Esc</kbd> 放弃</div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
