<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>東方戮影塔 〜 Formless Barrage</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #05060c;
      color: #e6edf3;
      font: 13px/1.6 "Consolas", "Menlo", monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 6px;
      min-height: 100vh;
      padding: 8px 0 10px;
      overflow: hidden;
      user-select: none;
    }
    /*
     * #stage 显式建立层叠上下文（z-index:0）。
     *
     * 不设时 canvas 会与 body 上的 fixed 元素产生歧义：
     * field-timer 在 body 末尾、z-index 45，却被 canvas 盖住。
     * 给 #stage 一个明确的低层级后，body 上 z-index>0 的元素才能稳定浮在上面。
     */
    #stage { position: relative; flex-shrink: 0; z-index: 0; }
    /*
     * canvas 必须显式设 z-index:0。
     * 它带 position 参与定位，不设 z-index 时在层叠顺序上
     * 可能与后插入的 DOM 元素产生歧义 —— 实测 field-timer
     * 明明 DOM 在前、样式可见，却被 canvas 盖住。
     */
    #stage canvas { display: block; position: relative; z-index: 0; }

    .panel {
      position: fixed;
      background: rgba(8, 10, 20, 0.86);
      border: 1px solid #2a3350;
      border-radius: 6px;
      backdrop-filter: blur(6px);
      pointer-events: none;
    }

    /* ── 右上角：图标化状态栏 ── */
    #hud-top {
      position: absolute;
      top: 8px;
      right: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
      pointer-events: none;
      z-index: 30;
    }
    .hud-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .hud-icon {
      width: 22px;
      height: 22px;
      image-rendering: pixelated;
      filter: drop-shadow(0 0 3px rgba(159, 227, 255, 0.4));
    }
    .hud-num {
      font-family: "Consolas", "Menlo", monospace;
      font-size: 16px;
      font-weight: 700;
      color: #9fe3ff;
      text-shadow: 0 0 6px rgba(159, 227, 255, 0.5);
      min-width: 18px;
      text-align: right;
    }
    .hud-spell-slots {
      display: flex;
      gap: 3px;
    }
    .hud-spell-slot {
      width: 26px;
      height: 26px;
      image-rendering: pixelated;
      opacity: 0.95;
    }
    .hud-spell-slot.empty { opacity: 0.32; }

    /* ── 战场内左上：幕 / 波次 / 倒计时 ── */
    #hud-stage {
      position: absolute;
      top: 8px;
      left: 10px;
      pointer-events: none;
      z-index: 30;
      font-family: "Consolas", "Menlo", monospace;
      font-size: 12px;
      color: #9fb4d0;
      letter-spacing: 1px;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
    }
    .stage-line { display: flex; align-items: center; gap: 6px; }
    .stage-act { color: #c79bff; font-weight: 700; font-size: 14px; }
    .stage-sep { color: #3a4a6a; }
    .stage-timer { color: #9fe3ff; }
    .stage-timer.urgent { color: #ff5c6e; font-weight: 700; }

    /* 操作提示：收起时只有一个小问号，点击展开 */
    #help.collapsed #help-body { display: none; }
    #help-toggle {
      pointer-events: auto;
      cursor: pointer;
      width: 22px; height: 22px;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid #2a3350;
      border-radius: 50%;
      color: #7d8aa8;
      font-size: 12px;
    }
    #help-toggle:hover { color: #9fe3ff; border-color: #4a6a9a; }

    /* ? 按钮占左下角最底部，被动区叠在它上面 */
    #help {
      bottom: 14px;
      left: 14px;
      padding: 9px 13px;
      color: #7d8aa8;
      font-size: 11px;
      line-height: 1.9;
    }
    kbd {
      background: #1a2135;
      border: 1px solid #2f3b5c;
      border-radius: 3px;
      padding: 1px 5px;
      color: #9fe3ff;
      font-size: 11px;
    }

    #title {
      position: fixed;
      top: 14px;
      right: 16px;
      color: #2f3b5c;
      font-size: 11px;
      letter-spacing: 1px;
      pointer-events: none;
    }

    /* ---------- 续关 / 结算 覆盖层 ---------- */
    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(3, 4, 9, 0.82);
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(3px);
      z-index: 10;
    }
    #overlay.hidden { display: none; }

    #overlay-box {
      background: rgba(10, 13, 24, 0.96);
      border: 1px solid #3a4a70;
      border-radius: 10px;
      padding: 26px 36px;
      min-width: 290px;
      text-align: center;
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.6);
    }
    #overlay-title {
      font-size: 19px;
      color: #ff8fa3;
      letter-spacing: 2px;
      margin-bottom: 14px;
    }
    #overlay-stats {
      color: #9fb0d0;
      font-size: 12px;
      line-height: 1.9;
      margin-bottom: 20px;
    }
    #overlay-stats b { color: #9fe3ff; }
    .btn-row { display: flex; gap: 12px; justify-content: center; }
    .btn {
      background: #1a2135;
      border: 1px solid #3a4a70;
      color: #cfe4ff;
      border-radius: 5px;
      padding: 8px 22px;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s;
    }
    .btn:hover {
      background: #24304e;
      border-color: #5a76b0;
    }
    .btn.primary {
      background: #2a3f66;
      border-color: #4a6ba8;
    }
    .btn.primary:hover { background: #35507f; }
    .btn-hint {
      margin-top: 14px;
      color: #55648a;
      font-size: 10.5px;
    }

    /* ---------- 手牌区 ---------- */
    /*
     * 手牌区固定在右下角（按需求：右下角是手牌区）。
     * 之前放在战场下方居中，那是错的 —— 会挤占战场，
     * 而且不符合"两侧放面板"的整体布局。
     */
    /*
     * 右下角垂直堆叠（自下而上）：
     *   牌堆按钮  bottom:14px  高约 34
     *   状态信息  bottom:52px
     *   手牌卡片  bottom:70px
     * 手牌区整体从 bottom:70 往上长，不会压到按钮。
     */
    /*
     * 手牌区贴在**战斗区正下方**，水平居中。
     * 具体 top 由 main.ts 按战场底边计算（见 syncLayout）。
     */
    #hand-area {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      width: 640px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      z-index: 25;
    }
    #hand-area .hand,
    #hand-area > div:not(.hand-info):not(.hand-count):not(.energy-wrap) {
      display: flex;
      justify-content: flex-end;
      gap: 5px;
    }
    #hand-area .hand-count { align-self: flex-end; }
    #hand-area .energy-wrap { align-self: flex-end; }

    .energy-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      max-width: 300px;
    }
    .energy-pips { display: flex; gap: 5px; }
    .pip {
      width: 13px; height: 13px;
      border-radius: 50%;
      background: #1a2135;
      border: 1px solid #3a4a70;
      transition: background 0.12s, box-shadow 0.12s;
    }
    .pip.on {
      background: #6fd3ff;
      box-shadow: 0 0 8px rgba(111, 211, 255, 0.7);
      border-color: #9fe3ff;
    }
    .energy-bar {
      flex: 1;
      height: 3px;
      background: #1a2135;
      border-radius: 2px;
      position: relative;
      overflow: hidden;
    }
    .energy-bar::after {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 0;
    }
    .energy-bar { --w: 0; }
    .energy-bar {
      background-image: linear-gradient(#6fd3ff, #6fd3ff);
      background-repeat: no-repeat;
      background-size: var(--w) 100%;
      transition: background-size 0.1s linear;
    }
    .energy-bar.full { background: #35507f; }

    .hand-root {
      display: flex;
      gap: 7px;
      justify-content: center;
      align-items: flex-end;
      min-height: 78px;
    }

    .card {
      width: calc(92px * var(--ui-scale, 1));
      height: calc(152px * var(--ui-scale, 1));
      background: linear-gradient(160deg, #141a2b, #0e1320);
      border: 1px solid #2f3b5c;
      border-radius: 6px;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 0;
      position: relative;
      overflow: hidden;
      transition: transform 0.12s, border-color 0.12s, box-shadow 0.12s;
      flex-shrink: 0;
      cursor: pointer;
    }

    /* 卡图：占卡片上半部，正方形等比裁切 */
    .card-art {
      position: relative;
      width: 100%;
      height: 100px;
      flex-shrink: 0;
      overflow: hidden;
      background: #0a0e18;
    }
    .card-art img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    /* 卡面下缘渐隐，让卡名读得出 */
    .card-art::after {
      content: '';
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 26px;
      background: linear-gradient(transparent, #0e1320);
    }
    .card.selected {
      border-color: #6fd3ff;
      transform: translateY(-9px);
      box-shadow: 0 0 14px rgba(111, 211, 255, 0.45);
    }
    .card.passive { border-color: #4a3a6b; }

    .card-art .card-cost {
      position: absolute;
      top: 3px; left: 3px;
      width: 20px; height: 20px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(8, 12, 22, 0.88);
      border: 1px solid #4a6a9a;
      border-radius: 50%;
      font-size: 12px;
      font-weight: 700;
      color: #9fe3ff;
      z-index: 2;
    }
    .card-cost {
      position: absolute;
      top: -6px; left: -6px;
      width: 19px; height: 19px;
      border-radius: 50%;
      background: #2a3f66;
      border: 1px solid #6fd3ff;
      color: #9fe3ff;
      font-size: 11px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card .card-name {
      padding: 3px 5px 0;
      font-size: calc(11px * var(--ui-scale, 1));
      line-height: 1.2;
      flex-shrink: 0;
    }
    .card .card-text {
      padding: 0 5px 4px;
      font-size: calc(9px * var(--ui-scale, 1));
      line-height: 1.35;
      color: #8794b0;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-name {
      font-size: 10.5px;
      color: #cfe4ff;
      font-weight: bold;
      text-align: center;
      margin-top: 2px;
      letter-spacing: 0.5px;
    }
    .card-text {
      font-size: 9px;
      color: #7d8aa8;
      line-height: 1.35;
      flex: 1;
      overflow: hidden;
    }

    /* 状态信息（满能量/过载/牌堆数）压在手牌下方一行 */
    .hand-info {
      font-size: 10px;
      color: #55648a;
      height: 14px;
      letter-spacing: 0.3px;
      text-align: right;
      width: 100%;
    }
    .hand-info.overload { color: #ff8fa3; }
    /* ══ 新 HUD ══ */

    /* 左上：幕次横幅 */
    #act-banner {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: 420px;
      height: 48px;
      pointer-events: none;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ab-frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      opacity: 0.85;
    }
    .ab-text {
      position: relative;
      font-family: "Songti SC", "SimSun", serif;
      font-size: calc(15px * var(--ui-scale, 1));
      letter-spacing: 3px;
      color: #ffe0c0;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9);
      white-space: nowrap;
    }

    /* 右侧空白区：状态列表，垂直居中偏上 */
    /* 位置由 main.ts 的 syncLayout 按战场矩形计算 */
    #top-status {
      position: fixed;
      right: auto;
      top: auto;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 14px;
      pointer-events: none;
      z-index: 30;
      font-family: "Consolas", "Menlo", monospace;
    }
    .ts-row {
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
      min-width: 150px;
    }
    .ts-label {
      font-size: calc(11px * var(--ui-scale, 1));
      color: #7d8aa8;
      letter-spacing: 2px;
      min-width: calc(34px * var(--ui-scale, 1));
    }
    .ts-num {
      font-size: calc(19px * var(--ui-scale, 1));
      font-weight: 700;
      color: #9fe3ff;
      text-shadow: 0 0 8px rgba(159, 227, 255, 0.45);
    }
    .ts-coin { width: 18px; height: 18px; image-rendering: pixelated; }

    .ts-stars { display: flex; gap: 4px; }
    .ts-stars .life-star {
      width: calc(16px * var(--ui-scale, 1)); height: calc(16px * var(--ui-scale, 1));
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%,
                         79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      background: linear-gradient(160deg, #ffe6a0, #ff9f5c);
      filter: drop-shadow(0 0 4px rgba(255, 200, 120, 0.7));
    }

    .ts-spells { display: flex; gap: 4px; }
    .ts-spells .spell-tag {
      width: calc(12px * var(--ui-scale, 1)); height: calc(24px * var(--ui-scale, 1));
      border-radius: 2px;
      background: linear-gradient(180deg, #e0c8ff, #9b6fd6);
      box-shadow: 0 0 6px rgba(180, 140, 255, 0.65);
    }

    /* 波次块：独占一段，与上面五项隔开 */
    .ts-wave-block {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-top: 6px;
      min-width: 150px;
    }

    /* 波次行：WAVE 6/12 + 进度条 + 倒计时 */
    .ts-wave-line {
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }
    .ts-wave-num { font-size: calc(11px * var(--ui-scale, 1)); color: #9fb4d0; letter-spacing: 1px; }
    .ts-wave-bar {
      width: calc(120px * var(--ui-scale, 1)); height: calc(5px * var(--ui-scale, 1));
      background: #1a2238;
      border-radius: 3px;
      overflow: hidden;
    }
    .ts-wave-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #4a7ad0, #9fe3ff);
      transition: width 0.15s linear;
    }
    .ts-timer { font-size: calc(13px * var(--ui-scale, 1)); font-weight: 700; color: #9fe3ff; min-width: 46px; text-align: right; }
    .ts-timer.urgent { color: #ff5c6e; animation: pulse-warn 0.8s ease-in-out infinite; }

    /* 左下：灵力 + 符卡 */
    /* 左下角自下而上：? 按钮(14) → 被动符卡(52) → 灵力/符卡(180) */
    /* 灵力/符卡：手牌区正上方，横向一行。top 由 main.ts 的 syncLayout 设 */
    #bottom-left {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 24px;
      pointer-events: none;
      z-index: 26;
      font-family: "Consolas", "Menlo", monospace;
    }
    .bl-group { display: flex; align-items: center; gap: 8px; }
    .bl-label { font-size: 10px; color: #7d8aa8; letter-spacing: 2px; min-width: 26px; }
    .bl-pips { display: flex; gap: 4px; }
    .bl-pips img { width: calc(22px * var(--ui-scale, 1)); height: calc(22px * var(--ui-scale, 1)); image-rendering: pixelated; }
    .bl-spellbar { display: flex; gap: 4px; }
    .bl-spellbar img { width: calc(30px * var(--ui-scale, 1)); height: calc(30px * var(--ui-scale, 1)); image-rendering: pixelated; }

    /* ── 商店界面 ── */
    .shop-overlay {
      position: fixed;
      inset: 0;
      background: rgba(4, 5, 12, 0.9);
      backdrop-filter: blur(3px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }
    .shop-overlay.hidden { display: none; }

    .shop-panel {
      width: 780px;
      max-height: 88vh;
      overflow-y: auto;
      background: #0b0d18;
      border: 1px solid #2a3350;
      border-radius: 6px;
      padding: 18px 20px;
      box-shadow: 0 12px 60px rgba(0, 0, 0, 0.7);
    }

    .shop-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid #222a44;
      padding-bottom: 10px;
      margin-bottom: 10px;
    }
    .shop-title {
      font-size: 16px;
      color: #c79bff;
      letter-spacing: 2px;
    }
    .shop-coins { font-size: 12px; color: #8f9ab8; }
    .shop-coins b { color: #ffd479; font-size: 15px; }

    .shop-hint {
      min-height: 18px;
      font-size: 12px;
      color: #8f9ab8;
      margin-bottom: 8px;
    }
    .shop-hint.warn { color: #ffb454; }

    .shop-list {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .shop-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 10px;
      min-height: 112px;
      background: #12172a;
      border: 1px solid #26304d;
      border-radius: 4px;
      color: #dfe6f5;
      font: inherit;
      text-align: left;
      cursor: pointer;
      transition: border-color .12s, background .12s;
    }
    .shop-item:hover:not(:disabled) {
      border-color: #6b8cff;
      background: #1a2140;
    }
    .shop-item.sold {
      opacity: .32;
      cursor: default;
    }
    .shop-item.expensive { border-color: #4a2530; }
    .shop-item.expensive .si-price { color: #ff7b8a; }

    .si-kind { font-size: 9px; color: #6f7d9c; letter-spacing: 1px; }
    .si-name { font-size: 13px; color: #e8eeff; font-weight: 600; }
    .si-energy { font-size: 10px; color: #7fd8ff; letter-spacing: .5px; }
    .si-desc { font-size: 10px; color: #93a0bd; line-height: 1.45; flex: 1; }
    .si-price { font-size: 11px; color: #ffd479; }

    .shop-remove {
      margin-top: 14px;
      border-top: 1px solid #222a44;
      padding-top: 12px;
    }
    .shop-remove.hidden { display: none; }
    .shop-remove-title { font-size: 12px; color: #ffb454; margin-bottom: 8px; }
    .shop-remove-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-height: 220px;
      overflow-y: auto;
    }
    .shop-remove-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 6px 10px;
      background: #1a1220;
      border: 1px solid #4a2a3a;
      border-radius: 3px;
      color: #e8d8e0;
      font: inherit;
      font-size: 11px;
      cursor: pointer;
    }
    .shop-remove-item:hover { border-color: #ff6b8a; background: #2a1520; }
    .sri-cost { font-size: 9px; color: #9a7a8a; }

    .shop-foot {
      margin-top: 14px;
      display: flex;
      justify-content: flex-end;
    }
    .shop-btn {
      padding: 8px 20px;
      background: #1c2440;
      border: 1px solid #3a4a75;
      border-radius: 4px;
      color: #cfe0ff;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }
    .shop-btn:hover { border-color: #6b8cff; background: #24305a; }

    /* ── 开发者控制台 ── */
    .dev-console {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: min(760px, 96vw);
      max-height: 45vh;
      display: flex;
      flex-direction: column;
      background: rgba(8, 10, 18, 0.97);
      border: 1px solid #2ea44f;
      border-bottom: none;
      border-radius: 6px 6px 0 0;
      z-index: 200;
      font: 12px/1.5 "Consolas", "Menlo", monospace;
      box-shadow: 0 -6px 40px rgba(0, 0, 0, 0.8);
    }
    .dev-console.hidden { display: none; }

    .dc-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 10px;
      background: #0f1a12;
      border-bottom: 1px solid #1e3a26;
      color: #4ade80;
      font-size: 11px;
      letter-spacing: 1px;
    }
    .dc-hint { color: #4b6b56; font-size: 10px; }

    .dc-output {
      flex: 1;
      overflow-y: auto;
      padding: 8px 10px;
      min-height: 120px;
      max-height: 30vh;
      color: #b8c4d0;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .dc-line { margin: 1px 0; }
    .dc-error { color: #ff7b8a; }
    .dc-output .dc-line:first-child { color: #6b7d8f; }

    .dc-input-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px 8px;
      border-top: 1px solid #1e3a26;
    }
    .dc-prompt { color: #4ade80; }
    .dc-input-row input {
      flex: 1;
      background: #05070c;
      border: 1px solid #24382c;
      border-radius: 3px;
      padding: 5px 8px;
      color: #d8e6de;
      font: inherit;
      outline: none;
    }
    .dc-input-row input:focus { border-color: #2ea44f; }

    /* ── 牌堆查看 ── */
    /*
     * 牌堆按钮：抽牌堆贴右下、弃牌堆贴左下、卡组在中间。
     * 位置由 main.ts 的 syncLayout 计算（跟随战斗区）。
     */
    /*
     * 两个按钮分别贴战斗框左右下角，而不是挤在中间 ——
     * 中间是手牌区，挤在一起会重叠。
     * 具体 left / right 由 main.ts 的 syncLayout 计算。
     */
    #pile-bar {
      position: fixed;
      top: auto;
      bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 8px;
      z-index: 40;
      pointer-events: none;
    }
    #pile-bar .pv-btn { pointer-events: auto; }

    /* 卡组按钮：手牌数右侧 */
    #deck-btn {
      position: fixed;
      pointer-events: auto;
      z-index: 40;
      padding: 5px 12px;
      font-size: calc(11px * var(--ui-scale, 1));
    }
    #pile-bar .pv-btn[data-tab="draw"] { order: 3; }
    #pile-bar .pv-btn[data-tab="discard"] { order: 1; }
    #pile-bar .pv-btn[data-tab="all"] { order: 2; }
    .pv-btn {
      padding: 6px 12px;
      background: #101526;
      border: 1px solid #26304d;
      border-radius: 4px;
      color: #9aa7c2;
      font: inherit;
      font-size: 11px;
      cursor: pointer;
      transition: border-color .12s, background .12s;
    }
    .pv-btn:hover { border-color: #6b8cff; background: #1a2140; }
    .pv-btn.active { border-color: #6b8cff; background: #1e2a52; color: #d0e0ff; }
    .pv-btn b { color: #ffd479; margin-left: 3px; }

    .pile-viewer {
      position: fixed;
      right: 14px;
      bottom: 54px;
      width: 300px;
      max-height: 52vh;
      display: flex;
      flex-direction: column;
      background: rgba(10, 13, 24, 0.97);
      border: 1px solid #2a3350;
      border-radius: 6px;
      z-index: 41;
      font: 11px/1.5 "Consolas", "Menlo", monospace;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.75);
    }
    .pile-viewer.hidden { display: none; }

    .pv-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 10px;
      border-bottom: 1px solid #222a44;
      color: #c79bff;
      font-size: 11px;
    }
    .pv-close {
      background: none;
      border: none;
      color: #6f7d9c;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      padding: 0 2px;
    }
    .pv-close:hover { color: #ff7b8a; }

    .pv-list {
      overflow-y: auto;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .pv-empty { color: #556071; padding: 12px; text-align: center; }

    .pv-card {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 6px;
      padding: 6px 8px;
      background: #12172a;
      border-left: 2px solid #3a4a75;
      border-radius: 3px;
    }
    .pv-card.passive { border-left-color: #c79bff; }
    .pv-name { color: #dfe6f5; font-weight: 600; }
    .pv-cost { color: #ffd479; font-size: 10px; }
    .pv-desc { flex-basis: 100%; color: #7d8aa5; font-size: 10px; }

    #wave-timer.urgent { color: #ff5c6e; font-weight: 700; }

    /* ── 横版两侧面板 ── */
    /* 战场固定 384 宽，两侧各 150。面板贴边排布，不覆盖战场。 */
    /* 面板贴着战场两侧，垂直方向上居中于战场 */
    .side-panel {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      width: 168px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      pointer-events: none;
      z-index: 30;
      font-family: "Consolas", "Menlo", monospace;
    }
    /*
     * 战场总宽 1094（684 逻辑 ×1.6），半宽 547。
     * 面板要贴在战场**外侧**，再留 12px 间隙。
     * 之前用 307（=192×1.6）算错了：那是战场「内容」半宽，
     * 不是整个画布半宽，结果面板压进了战场里。
     */
    #panel-left {
      left: 28px;
      align-items: flex-start;
    }
    /* 右侧面板整体上移，给右下角的手牌区让位 */
    #panel-right {
      right: 28px;
      align-items: flex-end;
      top: 20%;
    }

    .panel-block { display: flex; flex-direction: column; gap: 4px; }
    #panel-right .panel-block { align-items: flex-end; }

    .panel-label {
      font-size: 10px;
      color: #6f7d9c;
      letter-spacing: 2px;
    }
    .panel-value {
      font-size: 18px;
      font-weight: 700;
      color: #9fe3ff;
      text-shadow: 0 0 8px rgba(159, 227, 255, 0.45);
    }
    .panel-act {
      font-size: 26px;
      font-weight: 700;
      color: #c79bff;
      text-shadow: 0 0 10px rgba(199, 155, 255, 0.5);
      line-height: 1;
    }
    .panel-wave {
      font-size: 15px;
      color: #b8d4ee;
      letter-spacing: 1px;
    }
    .panel-timer {
      font-size: 19px;
      font-weight: 700;
      color: #9fe3ff;
      text-shadow: 0 0 8px rgba(159, 227, 255, 0.4);
    }
    .panel-timer.urgent {
      color: #ff5c6e;
      text-shadow: 0 0 10px rgba(255, 92, 110, 0.6);
      animation: pulse-warn 0.8s ease-in-out infinite;
    }
    @keyframes pulse-warn {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.55; }
    }

    /* 残机：东方正作式的小星形，每台一个 */
    .lives-row { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }
    .life-star {
      width: 15px;
      height: 15px;
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%,
                         79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      background: linear-gradient(160deg, #ffe6a0, #ff9f5c);
      filter: drop-shadow(0 0 4px rgba(255, 200, 120, 0.7));
    }
    .life-star.lost { background: #2a3350; filter: none; opacity: 0.45; }

    /* 符卡：竖长符札形 */
    .spell-row { display: flex; gap: 5px; justify-content: flex-end; }
    .spell-tag {
      width: 13px;
      height: 26px;
      border-radius: 2px;
      background: linear-gradient(180deg, #e0c8ff, #9b6fd6);
      box-shadow: 0 0 6px rgba(180, 140, 255, 0.65);
      position: relative;
    }
    .spell-tag::after {
      content: '';
      position: absolute;
      left: 50%; top: 5px; bottom: 5px;
      width: 1px;
      background: rgba(255, 255, 255, 0.5);
      transform: translateX(-50%);
    }
    .spell-tag.empty {
      background: #232a44;
      box-shadow: none;
      opacity: 0.5;
    }
    .spell-tag.empty::after { background: rgba(255,255,255,0.12); }

    .coin-row { display: flex; align-items: center; gap: 6px; }
    .coin-icon { width: 20px; height: 20px; image-rendering: pixelated; }

    /* ── 卡组总览（Tab） ── */
    .deck-overlay {
      position: fixed;
      inset: 0;
      background: rgba(4, 6, 12, 0.88);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 120;
    }
    .deck-overlay.hidden { display: none; }

    .deck-panel {
      width: min(900px, 92vw);
      max-height: 86vh;
      display: flex;
      flex-direction: column;
      background: #0a0d18;
      border: 1px solid #2a3350;
      border-radius: 8px;
      box-shadow: 0 20px 80px rgba(0, 0, 0, 0.85);
      overflow: hidden;
    }
    .deck-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 14px 20px;
      border-bottom: 1px solid #1e2740;
    }
    .deck-title { font-size: 17px; color: #c79bff; letter-spacing: 3px; }
    .deck-close-hint { font-size: 11px; color: #55607a; }

    .deck-stats {
      display: flex;
      gap: 26px;
      padding: 10px 20px;
      font-size: 12px;
      color: #8794b0;
      border-bottom: 1px solid #161d31;
    }
    .deck-stats b { color: #9fe3ff; font-size: 14px; margin: 0 2px; }

    .deck-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
      gap: 8px;
      padding: 16px 20px;
      overflow-y: auto;
    }
    .deck-card {
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 9px 10px;
      min-height: 96px;
      background: #12172a;
      border: 1px solid #26304d;
      border-left: 3px solid #6b8cff;
      border-radius: 4px;
    }
    .deck-card.passive { border-left-color: #c79bff; background: #171228; }
    .dc-top { display: flex; justify-content: space-between; align-items: baseline; gap: 4px; }
    .dc-name { font-size: 13px; color: #e8eeff; font-weight: 600; }
    .dc-count { font-size: 11px; color: #ffd479; }
    .dc-cost { font-size: 10px; color: #7fd8ff; }
    .dc-text { font-size: 10px; color: #8a97b4; line-height: 1.5; flex: 1; }
    .deck-empty { color: #55607a; padding: 30px; text-align: center; grid-column: 1/-1; }

    .deck-foot {
      padding: 8px 20px;
      border-top: 1px solid #1e2740;
      font-size: 11px;
      color: #6f7d9c;
      text-align: center;
    }

    /* 手牌数 / 上限 */
    .hand-count {
      font-family: "Consolas", "Menlo", monospace;
      font-size: calc(12px * var(--ui-scale, 1));
      color: #8794b0;
      letter-spacing: 1px;
      margin-bottom: 2px;
    }
    .hand-count::first-letter { color: #6f7d9c; }

    /* ── 左下角：被动符卡区 ── */
    /* 位置由 syncLayout 计算：贴在弃牌堆按钮上方 */
    #passive-slots {
      position: fixed;
      left: 28px;
      bottom: auto;
      width: 168px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      pointer-events: none;
      z-index: 26;
      font-family: "Consolas", "Menlo", monospace;
    }
    .ps-title {
      font-size: 10px;
      color: #6f7d9c;
      letter-spacing: 2px;
    }
    .ps-row {
      display: flex;
      gap: 6px;
    }
    .ps-slot {
      width: 62px;
      height: 86px;
      border-radius: 5px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-sizing: border-box;
    }
    /* 已装备：卡图 + 名称 */
    .ps-slot.filled {
      background: #171228;
      border: 1px solid #6b4a9e;
      box-shadow: 0 0 10px rgba(199, 155, 255, 0.28);
    }
    .ps-slot.filled img {
      width: 100%;
      height: 62px;
      object-fit: cover;
      display: block;
    }
    .ps-name {
      font-size: 9px;
      color: #d8c8f0;
      padding: 2px 4px;
      line-height: 1.2;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    /* 空槽：虚线虚位，明确"这里还没有东西" */
    .ps-slot.empty {
      border: 1px dashed #2e3a58;
      background: rgba(12, 16, 28, 0.5);
      align-items: center;
      justify-content: center;
    }
    .ps-plus {
      font-size: 22px;
      color: #33405e;
      line-height: 1;
    }

    /* 战斗框内右上角倒计时：仅道中 10s 内或 BOSS 战显示 */
    #field-timer {
      position: fixed;
      display: flex;
      align-items: center;
      gap: 3px;
      font-family: "Consolas", "Menlo", monospace;
      font-size: calc(30px * var(--ui-scale, 1));
      font-weight: 700;
      color: #ffd479;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.95);
      letter-spacing: 1px;
      pointer-events: none;
      z-index: 45;
      /* 位置由 JS 设为战斗框右缘内侧，用 translateX(-100%) 让它向左展开 */
      transform: translateX(-100%);
      padding: 2px 6px;
    }
    #field-timer.hidden { display: none; }
    #field-timer.warn {
      color: #ff4d5e;
      text-shadow: 0 0 14px rgba(255, 77, 94, 0.8);
      animation: timer-pulse 1s steps(2, end) infinite;
    }
    @keyframes timer-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    /*
     * 两个面板展开方向不同：
     *   弃牌堆在左  → 面板贴按钮左侧，向左展开
     *   抽牌堆在右  → 面板贴按钮右侧，向右展开
     * 用 data-anchor 区分，位置由 JS 设置。
     */
    .pile-viewer[data-anchor="left"]  { transform: translateX(-100%); }
    .pile-viewer[data-anchor="right"] { transform: none; }

    /* 灵力右侧的状态提示 */
    .bl-status {
      font-family: "Consolas", "Menlo", monospace;
      font-size: calc(11px * var(--ui-scale, 1));
      color: #8794b0;
      letter-spacing: 0.5px;
      min-width: calc(96px * var(--ui-scale, 1));
    }
    .bl-status.warn { color: #ff8fa3; }

  </style>
</head>
<body>
  <div id="stage"></div>

  <div id="title">東方戮影塔 〜 Formless Barrage</div>

  <!-- 手牌与能量（DOM 实现，位于场地下方） -->

  <!-- 左上：幕次横幅（借用 act_banner 素材，中央留白处写幕名） -->
  <div id="act-banner">
    <img class="ab-frame" id="act-banner-img" src="./art/ui/act_banner_1.png" alt="" />
    <div class="ab-text" id="act-name">第一幕　妖怪之山 · 流言</div>
  </div>

  <!-- 右侧空白区：状态，一行一组 -->
  <div id="top-status">
    <div class="ts-row">
      <span class="ts-label">残机</span>
      <span class="ts-stars" id="lives-row"></span>
    </div>
    <div class="ts-row">
      <span class="ts-label">符卡</span>
      <span class="ts-spells" id="spell-row"></span>
    </div>
    <div class="ts-row">
      <span class="ts-label">蜃銭</span>
      <img class="ts-coin" src="./art/ui/coin_icon.png" alt="" />
      <span class="ts-num" id="coins">0</span>
    </div>
    <div class="ts-row">
      <span class="ts-label">击破</span>
      <span class="ts-num" id="kills">0</span>
    </div>
    <div class="ts-row">
      <span class="ts-label">得分</span>
      <span class="ts-num" id="score">0</span>
    </div>

    <div class="ts-wave-block">
      <div class="ts-wave-num" id="wave">WAVE 1 / 12</div>
      <div class="ts-wave-bar"><div class="ts-wave-fill" id="wave-bar"></div></div>
    </div>
  </div>

  <!-- 左下：灵力 + 符卡（参考图那种图标排，素材是现成的） -->
  <div id="bottom-left">
    <div class="bl-group">
      <span class="bl-label">灵力</span>
      <div class="bl-pips" id="energy-pips"></div>
    </div>
    <!-- 过载 / 能量提示：紧贴灵力右侧 -->
    <div class="bl-status" id="bl-status"></div>
  </div>

  <!-- 战斗框内右上角：仅道中倒计时 10s 内或 BOSS 战显示 -->
  <div id="field-timer" class="hidden">10</div>

  <div id="hand-area"></div>

  <!-- 卡组按钮：贴在手牌数右侧 -->
  <button id="deck-btn" class="pv-btn">卡组 <b id="pv-count-all">0</b></button>

  <!-- 隐藏数据源：fps 只用来看性能，不显示 -->
  <div id="hud-data" style="display:none">
    <span id="fps">—</span>
  </div>

  <div id="overlay" class="hidden">
    <div id="overlay-box">
      <div id="overlay-title">残机耗尽</div>
      <div id="overlay-stats"></div>
      <div class="btn-row">
        <button class="btn primary" id="btn-continue" data-action="continue">续关</button>
        <button class="btn" id="btn-giveup" data-action="giveup">放弃</button>
      </div>
      <div class="btn-hint"><kbd>Enter</kbd> 续关　<kbd>Esc</kbd> 放弃</div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
